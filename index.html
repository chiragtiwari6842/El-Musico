<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-box">El-Musico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bitter:400,700">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700">
</head>
<body class="p-0 m-0 fs-6" style="padding-bottom: 50px;background: rgb(0,0,0);">
    <header class="header-dark" style="color: rgb(205,205,205);padding: 0px 0px 10px;">
        <div class="container">
            <div class="row">
                <div class="col-md-8 offset-md-2">
                    <h1 class="text-center m-0 user-select-none">
                        <span class="el-cursive">El - Musico</span>
                    </h1>
                    <h3 class="text-center user-select-none" 
                        style="color: rgba(249,255,255,0.81);font-family: Bitter, serif;">
                        Where Music Comes Alive
                    </h3>
                </div>
            </div>
        </div>
    </header>
    <div>
        <div class="tab-content">
            <div class="tab-pane active" role="tabpanel" id="tab-1">
                <section 
                    class="highlight-clean pt-2" 
                    style="background: url('assets/el-musico_background.png') no-repeat center center fixed;">
                    <div class="text-center">
                        <select id="music-bitrate" class="user-select-none">
                            <option value="4" selected="">320kbps(default)</option>
                            <option value="3">160kbps</option>
                            <option value="2">96kbps</option>
                            <option value="1">48kbps</option>
                        </select>
                    </div>
                    <p class="text-center" style="padding: 0px 5px;"></p>
                    <div class="container" style="padding: 0px;">
                        <div class="intro">
                            <form class="text-center mx-auto p-0" action="#" method="get">
                                <div class="d-flex align-items-center" 
                                    placeholder="Enter Song, Artist or Album name">
                                    <input class="form-control float-left fit-content m-0 w-75" id="music-search-box"
                                        type="text" 
                                        style="color: var(--gray-dark);
                                               border-radius: 20px;" 
                                        placeholder="Search for a Song or Artist" 
                                        autocomplete="off">
                                    <button class="btn btn-primary text-center" id="search-trigger" 
                                        type="submit" 
                                        title="Search" 
                                        style="border-radius: 20px;" 
                                        onclick="MusicSearch()">
                                        Search
                                    </button>
                                </div>
                            </form>
                            <button 
                                class="d-flex user-select-none h-auto w-auto align-items-center justify-content-center"
                                style="color: #2d5f6e; 
                                       margin-right: 0px;" 
                                onclick="showPlaylists()">
                                Playlists
                            </button>
                             <button class="user-select-none h-auto w-auto d-flex text-center me-0 justify-content-center"
                                style="color: #2d5f6e;" 
                                onclick="playAll()">
                                Play All
                            </button>
                        </div>
                            <div id="music-results" style="margin-bottom: 20px;">
                                <h5>Featured</h5>
                            </div>
                            <div class="text-center" style="width:100%">
                                <button id="first-page" class="user-select-none"
                                    title="First Page" 
                                    style="width: 48%;">
                                    Back To First Page
                                </button>
                                <button id="next" class="user-select-none"
                                    title="Next" 
                                    style="width: 48%;">
                                    Next
                                </button>
                            </div>
                            <div class="button-container">
                            </div>
                        <div style="padding-bottom: 60px;">
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <div class="music-player" id="audio-player">
        <div class="progress-controller">
            <div class="control-buttons">
                <img id="repeat" class="repeat-button cursor-pointer user-select-none" 
                    src="assets/repeat.png" 
                    alt="Repeat" 
                    onclick="repeatSong()">
                <svg id="left-seek" class="left-button cursor-pointer" 
                    onclick="playPreviousSong()"
                    width="40" 
                    height="32" 
                    viewBox="0 0 24 24" 
                    fill="#fff">
                    <polygon points="3 5 11 12 3 19"/><polygon 
                    points="11 5 19 12 11 19" />
                </svg>                
                <svg id="play-pause-icon" class="play-pause cursor-pointer" 
                    onclick="togglePlay()"
                    width="32" 
                    height="32" 
                    viewBox="0 0 24 24" 
                    fill="#fff">
                    <polygon points="6,4 20,12 6,20" />
                </svg>
                
                <svg id="right-seek" class="right-button cursor-pointer" 
                    onclick="playNextSong()" 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="40" 
                    height="32" 
                    viewBox="0 0 24 24" 
                    fill="#fff">
                    <polygon  points="3 5 11 12 3 19" />
                    <polygon points="11 5 19 12 11 19" />
                </svg>
                <img id="queue" class="queue-button cursor-pointer user-select-none "  
                    src="assets/queue.png" 
                    alt="Show Queue" 
                    onclick="showQueue()">
            </div>

            <div class="progress-container gap-3">
                <span id="current-time" class="duration-bar user-select-none">0:00</span>
                <div class="progress-bar cursor-pointer" id="progress-bar" 
                    onclick="seekTo(event)">
                    <div class="progress user-select-none" id="progress"></div>
                </div>
                <span id="duration" class="duration-bar user-select-none">0:00</span>
            </div>
        </div>
        <div class="other-features">
            <div class="volume-bar">
                <img id="volume-control" class="volume-control cursor-pointer user-select-none" 
                    src="assets/volume.png" 
                    alt="Volume" 
                    onclick="toggleVolume()">
                <input class="volume-slider cursor-pointer user-select-none" id="volume-slider" 
                    type="range" 
                    min="0" 
                    max="1" 
                    step="0.1" 
                    value="1" />
                <div class="progress-bar cursor-pointer">
                    <div class="progress user-select-none" id="volume"></div>
                </div>
            </div>
        </div>
        <audio class="d-none" id="player" 
            controls="controls" 
            controlsList="nodownload" 
            crossorigin="anonymous">
            <source id="audioSource" src="">
            Your browser does not support the audio format.
        </audio>
    </div>
    <style>
        #music-results{
        display: flex;
        flex-wrap: wrap;
        }
        @media screen and (min-width: 992px){
            .song-container{
                width: calc(33.33% - 20px);
                margin: 0 10px 20px 10px;
            }
        }
        @media screen and (min-width: 768px) and (max-width: 991px){
            .song-container{
                width: calc(50% - 20px);
                margin: 0 10px 20px 10px;
            }
        }
        @media screen and (max-width: 767px){
            .song-container{
                width: calc(100% - 20px);
                margin: 0 10px 20px 10px;
            }
        }
        .music-player {
            --primary-color: #ddd;
            --secondary-color: #999;
            --green-color: #2d5;
            --padding: 1.5em;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 7rem;
            padding: var(--padding);
            color: var(--primary-color);
        }

        .progress-controller {
            width: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 1.5em;
            color: var(--secondary-color);
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 2em;
        }

        .left-button{
            transform: rotate(180deg);
        }
        .queue-button{
            width: 32px;
            height: 32px;
        }
        .play-pause {
            width: 28px;
            height: 28px;
            display: block;
            position: relative;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 999;
        }

        .progress-container {
            width: 155%;
            height: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-bar {
            height: 6px;
            border-radius: 10px;
            width: 60%;
            background-color: #ccc4;
            position: relative;
        }

        .progress-bar:hover .progress{
            background-color: #055ada;
        }
        .progress {
            position: absolute;
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background-color: #ffffff;
            z-index: 1;
        }
        .progress::-moz-range-thumb {
            width: 600px;
            height: 600px;
            background: #fff;
            border-radius: 50%;
        }
        .volume-slider {
            /* -webkit-appearance: none;  */
            width: 100px;
            height: 5px;
            background: #ffffff;
            border-radius: 5px;
        }
        .volume-slider:hover {
            background: #ffffff;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #055ada;
            border-radius: 50%;
        }
        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
        }
        .other-features {
            position: absolute;
            right: var(--padding);
            display: flex;
            align-items: center;
            flex-direction: row;
            gap: 1em;
        }

        .volume-bar {
            display: flex;
            margin-bottom: 22px;
            align-items: center;
            gap: .7em;
        }
        .volume-control {
            width: 32px;
            height: 32px;
        }
        .repeat-button {
            display: flex;
            width: 25px;
            height: 25px;
            position: relative;
            z-index: 10;
        }
        .duration-bar{
            /* background-color: #055ada; */
            /* color: #055ada;  */
            border-radius: 3px; width: 50px;
            text-align: center;
        }
        @media screen and (max-width: 767px) {
            .volume-bar {
                display: none;
            }
            #current-time {
                margin-left: 0px;
                padding-left: 10px;
                padding-right: 0px;
                margin-right: 0px;
            }
            .progress-bar {
                width: 220px;
            }
            #duration-bar {
                margin-left: 0px;
                padding-left: 0px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
    <script src="utils.js"></script>
    <script src="suggestion.js"></script>
    <script src="queue.js"></script>
    <script src="repeat.js"></script>
    <script src="volumeControls.js"></script>
    <script src="updateProgressBar.js"></script>
    <script src="8d.js"></script>
    <script src="playControls.js"></script>
    <script src="bulk_play.js"></script>
    <script src="playlists.js"></script>
    <script src="search.js"></script>
    <script src="footerButtons.js"></script>
    <script src="shortcuts.js"></script>
</body>
</html>
